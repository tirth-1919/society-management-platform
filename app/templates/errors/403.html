{% extends "base.html" %}
{% block title %}403 Forbidden - Access Denied{% endblock %}
{% block content %}
<div style="max-width: 500px; margin: 60px auto; text-align: center;">
    <div style="font-size: 64px; color: var(--danger); margin-bottom: 16px;"><i class="fa-solid fa-user-slash"></i></div>
    <h2>403 Forbidden - Cross-Tenant Violation</h2>
    <p style="color: var(--text-secondary); margin-bottom: 24px;">You are not authorized to access resources belonging to another society tenant.</p>
    <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary">Return to Dashboard</a>
</div>
{% endblock %}
