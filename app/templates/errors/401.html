{% extends "base.html" %}
{% block title %}401 Unauthorized{% endblock %}
{% block content %}
<div style="max-width: 500px; margin: 60px auto; text-align: center;">
    <div style="font-size: 64px; color: var(--warning); margin-bottom: 16px;"><i class="fa-solid fa-lock"></i></div>
    <h2>401 Unauthorized</h2>
    <p style="color: var(--text-secondary); margin-bottom: 24px;">Please log in to access this page.</p>
    <a href="{{ url_for('auth.login') }}" class="btn btn-primary">Go to Login</a>
</div>
{% endblock %}
