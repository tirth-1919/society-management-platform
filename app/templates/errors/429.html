{% extends "base.html" %}
{% block title %}429 Too Many Requests{% endblock %}
{% block content %}
<div style="max-width: 500px; margin: 60px auto; text-align: center;">
    <div style="font-size: 64px; color: var(--warning); margin-bottom: 16px;"><i class="fa-solid fa-hourglass-half"></i>
    </div>
    <h2>429 Too Many Requests</h2>
    <p style="color: var(--text-secondary); margin-bottom: 24px;">You have exceeded the allowed request rate. Please
        wait a moment and try again.</p>
    <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary">Return to Dashboard</a>
</div>
{% endblock %}
