{% extends "base.html" %}
{% block title %}404 Page Not Found{% endblock %}
{% block content %}
<div style="max-width: 500px; margin: 60px auto; text-align: center;">
    <div style="font-size: 64px; color: var(--warning); margin-bottom: 16px;"><i class="fa-solid fa-compass-drafting"></i></div>
    <h2>404 Page Not Found</h2>
    <p style="color: var(--text-secondary); margin-bottom: 24px;">The requested page or record does not exist.</p>

</div>
{% endblock %}
