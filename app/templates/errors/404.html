{% extends "base.html" %}
{% block title %}404 Page Not Found · Society SaaS{% endblock %}
{% block content %}
<div class="error-page-container">
    <div class="error-illustration"><i class="fa-solid fa-compass-drafting"></i></div>
    <div class="error-code-badge">404</div>
    <h2 class="page-title">Page Not Found</h2>
    <p class="error-desc" style="color: var(--text-secondary); margin: 12px auto 24px auto;">
        The requested page or record could not be found. It may have been moved, renamed, or deleted.
    </p>
    <div style="display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;">
        <button type="button" onclick="history.back()" class="btn btn-outline">
            <i class="fa-solid fa-arrow-left"></i> Go Back
        </button>
        <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary">
            <i class="fa-solid fa-house"></i> Dashboard
        </a>
        <button type="button" onclick="window.openGlobalSearch && window.openGlobalSearch()" class="btn btn-secondary">
            <i class="fa-solid fa-magnifying-glass"></i> Search
        </button>
    </div>
</div>
{% endblock %}
